<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Convertly — Unit Converter</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Convertly home">
        <span class="brand-mark" aria-hidden="true">↔</span>
        <span>convertly</span>
      </a>
      <span class="topbar-note">A little clarity for everyday conversions</span>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div class="eyebrow"><span class="eyebrow-dot"></span> SIMPLE UNIT CONVERTER</div>
      <h1 id="page-title">Make every unit<br><span>make sense.</span></h1>
      <p class="intro">Quick, accurate conversions for the things you measure every day.</p>
    </section>

    <section class="converter-card" aria-label="Unit converter">
      <div class="card-heading">
        <div>
          <h2>Convert units</h2>
          <p>Choose a category and enter a value to get started.</p>
        </div>
        <span class="sparkle" aria-hidden="true">✳</span>
      </div>

      <form id="converter-form">
        <label class="field-label" for="category">CATEGORY</label>
        <select id="category" name="category"></select>

        <div class="conversion-row">
          <div class="conversion-field">
            <label class="field-label" for="value">VALUE</label>
            <input id="value" name="value" type="number" step="any" placeholder="e.g. 12.5" required>
          </div>
          <div class="conversion-field">
            <label class="field-label" for="from_unit">FROM</label>
            <select id="from_unit" name="from_unit"></select>
          </div>
        </div>

        <div class="swap-divider" aria-hidden="true"><span>↓</span></div>

        <label class="field-label" for="to_unit">TO</label>
        <select id="to_unit" name="to_unit"></select>

        <button type="submit">Convert <span aria-hidden="true">→</span></button>
      </form>

      <div id="result" aria-live="polite"></div>
    </section>

    <footer>Made for curious minds <span aria-hidden="true">✦</span></footer>
  </main>

  <script>
    "use strict";
    const units = {
      "Length": {
        "Meters (m)": 1, "Kilometers (km)": 1000, "Centimeters (cm)": 0.01,
        "Millimeters (mm)": 0.001, "Miles (mi)": 1609.344, "Yards (yd)": 0.9144,
        "Feet (ft)": 0.3048, "Inches (in)": 0.0254
      },
      "Mass": {
        "Kilograms (kg)": 1, "Grams (g)": 0.001, "Milligrams (mg)": 0.000001,
        "Pounds (lb)": 0.45359237, "Ounces (oz)": 0.028349523125
      },
      "Volume": {
        "Liters (L)": 1, "Milliliters (mL)": 0.001, "Cubic meters (m³)": 1000,
        "US gallons (gal)": 3.785411784, "US cups (cup)": 0.2365882365
      },
      "Area": {
        "Square meters (m²)": 1, "Square kilometers (km²)": 1000000,
        "Square centimeters (cm²)": 0.0001, "Square feet (ft²)": 0.09290304,
        "Acres (ac)": 4046.8564224
      },
      "Temperature": {
        "Celsius (°C)": 1, "Fahrenheit (°F)": 1, "Kelvin (K)": 1
      }
    };

    const categorySelect = document.getElementById("category");
    const fromSelect = document.getElementById("from_unit");
    const toSelect = document.getElementById("to_unit");
    const valueInput = document.getElementById("value");
    const result = document.getElementById("result");
    const formatter = new Intl.NumberFormat("en-US", { maximumSignificantDigits: 8 });

    function populate(select, options, selected) {
      select.replaceChildren(...options.map((label) => {
        const option = document.createElement("option");
        option.value = label;
        option.textContent = label;
        return option;
      }));
      if (options.includes(selected)) select.value = selected;
    }

    function updateUnits() {
      const options = Object.keys(units[categorySelect.value]);
      populate(fromSelect, options, options[0]);
      populate(toSelect, options, options.length > 1 ? options[1] : options[0]);
      result.replaceChildren();
    }

    function convertTemperature(value, from, to) {
      let celsius = value;
      if (from === "Fahrenheit (°F)") celsius = (value - 32) * 5 / 9;
      if (from === "Kelvin (K)") celsius = value - 273.15;
      if (to === "Fahrenheit (°F)") return celsius * 9 / 5 + 32;
      if (to === "Kelvin (K)") return celsius + 273.15;
      return celsius;
    }

    categorySelect.addEventListener("change", updateUnits);
    document.getElementById("converter-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const value = Number(valueInput.value);
      if (!Number.isFinite(value)) {
        result.replaceChildren(Object.assign(document.createElement("div"), {
          className: "message error", textContent: "Enter a valid number."
        }));
        return;
      }

      const category = categorySelect.value;
      const from = fromSelect.value;
      const to = toSelect.value;
      const converted = category === "Temperature"
        ? convertTemperature(value, from, to)
        : value * units[category][from] / units[category][to];
      const panel = document.createElement("div");
      panel.className = "result-panel";
      panel.setAttribute("role", "status");
      const label = document.createElement("span");
      label.className = "result-label";
      label.textContent = "YOUR RESULT";
      const inputSummary = document.createElement("p");
      inputSummary.append(document.createTextNode(formatter.format(value) + " "));
      const sourceUnit = document.createElement("span");
      sourceUnit.textContent = from;
      inputSummary.append(sourceUnit);
      const answer = document.createElement("div");
      answer.className = "result-answer";
      const equals = document.createElement("span");
      equals.className = "equals";
      equals.textContent = "=";
      const number = document.createElement("strong");
      number.textContent = formatter.format(converted);
      const targetUnit = document.createElement("span");
      targetUnit.textContent = to;
      answer.append(equals, number, targetUnit);
      panel.append(label, inputSummary, answer);
      result.replaceChildren(panel);
    });

    populate(categorySelect, Object.keys(units), "Length");
    updateUnits();
  </script>
</body>
</html>
